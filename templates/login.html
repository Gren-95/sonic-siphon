<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Sonic Siphon</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" type="text/css" href="/static/css/main.css">
    <script>
        // Apply the saved theme before paint to avoid a flash.
        (function () {
            const t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body class="bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-50 min-h-screen flex items-center justify-center px-4">
    <main class="w-full max-w-sm">
        <div class="flex flex-col items-center gap-3 mb-8">
            <img src="/static/favicon.svg" alt="" class="w-12 h-12">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-600 to-emerald-500 dark:from-emerald-400 dark:to-emerald-300 bg-clip-text text-transparent">
                Sonic Siphon
            </h1>
            <p class="text-sm text-stone-500 dark:text-stone-400">Sign in to continue</p>
        </div>

        <form method="POST" action="/login" class="bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-2xl p-6 shadow-sm">
            <div id="errorBanner" class="hidden mb-4 px-3 py-2 rounded-lg bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/60 text-sm text-red-800 dark:text-red-200">
                <span id="errorInvalid" class="hidden">Invalid username or password.</span>
                <span id="errorRateLimit" class="hidden">Too many failed attempts. Please wait a few minutes and try again.</span>
            </div>

            <label class="block text-sm font-medium mb-1" for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                autofocus
                class="w-full mb-4 px-3 py-2 rounded-lg bg-stone-50 dark:bg-stone-950 border border-stone-300 dark:border-stone-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
            >

            <label class="block text-sm font-medium mb-1" for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                class="w-full mb-6 px-3 py-2 rounded-lg bg-stone-50 dark:bg-stone-950 border border-stone-300 dark:border-stone-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
            >

            <button type="submit" class="w-full px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 dark:bg-emerald-500 dark:hover:bg-emerald-400 text-white font-medium transition-colors">
                Sign in
            </button>
        </form>
    </main>

    <script>
        const err = new URLSearchParams(location.search).get('err');
        if (err === '1' || err === '2') {
            document.getElementById('errorBanner').classList.remove('hidden');
            const which = err === '2' ? 'errorRateLimit' : 'errorInvalid';
            document.getElementById(which).classList.remove('hidden');
        }
    </script>
</body>
</html>
